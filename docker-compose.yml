# 酒醴 Web UI（Docker）
# 用法：
#   docker compose up -d          # 打开 http://127.0.0.1:8770
#   挂载你的卡片语义包到 /app/pkg
services:
  jiuli:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../jiuli-runtime:/app
      - ../jiuli-real-test/pkg:/app/pkg
      - jiuli-data:/app/data
    command: python -m jiuli.server --pkg /app/pkg --db /app/data/jiuli.db --host 0.0.0.0 --port 8770 --mock
    ports:
      - "8770:8770"
    restart: unless-stopped
volumes:
  jiuli-data:
